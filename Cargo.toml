[package]
name = "astroom"
version = "0.1326.0"
edition = "2021"
description = "Autonomous job acquisition, filtering, LLM evaluation, and tailored application-materials generation pipeline (Indeed, LinkedIn)"
license = "MIT"
authors = ["AstroOM Contributors"]
repository = "https://github.com/sudoTni/AstroOM"
readme = "README.md"
keywords = ["jobs", "scraping", "llm", "openrouter", "automation", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]
# Verified minimum: the tree uses `Option::is_none_or` (1.82), `Waker::noop` (1.85),
# `usize::is_multiple_of` (1.87), and `u64::div_ceil` (1.73). Enforced by clippy's
# `incompatible_msrv` lint, which fails the build on any newer API.
rust-version = "1.87"

[[bin]]
name = "astroom"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "stream", "gzip", "default-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1"
scraper = "0.19"
libc = "0.2"
indexmap = { version = "2", features = ["serde"] }
gif = "0.14"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# `strip` and `lto` keep the distributed release artifact small.
# `panic = "abort"` is deliberately NOT set: the statistics collector and the
# offline integration tests rely on unwinding to report structured failures.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
